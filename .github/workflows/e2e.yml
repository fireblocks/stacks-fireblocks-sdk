name: E2E Tests

# FBS-32 — Release test matrix. Each of the following must be release-blocking before a
# tagged release. Suites marked (infra) require a running PoX-5 node + deployed contracts;
# suites marked (app) live in the desktop-app repo, not here.
#   - unit + integration ......................... build.yml (every push/PR) ✓
#   - type-check of all tracked suites ........... build.yml (every push/PR) ✓
#   - STX stake / increase / extend / claim / unstake .. this workflow (against testnet)
#   - native-BTC enrollment, idempotent retry, maturity, recovery .. (infra)
#   - early exit through Bitcoin confirmation .... (infra)
#   - sBTC first registration, all rollover deltas, renewal, withdrawal .. (infra, FBS-39/14)
#   - signer rotation and calldata ............... (infra)
#   - two-phase rewards with partial failure and restart .. (infra)
#   - corrupt-store and interrupted-write recovery .. fileLockRecordStore.test.ts ✓ (unit)
#   - network mismatch and unavailable-service failures .. network.test.ts ✓ (unit, partial)
#   - desktop renderer .......................... (app)
# The job records the exact tested node + PoX-5 contract commit into the run summary so a
# release artifact captures what was actually exercised.

on:
  workflow_dispatch: # Manual trigger
  schedule:
    - cron: '0 6 * * 1' # Weekly on Monday 6am UTC

jobs:
  e2e:
    runs-on: ubuntu-latest
    environment: testnet

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      # Record the exact node + contract commit the release was tested against. Populate
      # the STACKS_NODE_COMMIT / POX5_CONTRACT_COMMIT repo variables per release.
      - name: Record tested node & contract commits
        env:
          NODE_COMMIT: ${{ vars.STACKS_NODE_COMMIT }}
          CONTRACT_COMMIT: ${{ vars.POX5_CONTRACT_COMMIT }}
          STACKS_API_URL: ${{ vars.STACKS_API_URL }}
        run: |
          {
            echo "## E2E release artifact"
            echo "- SDK commit: \`$GITHUB_SHA\`"
            echo "- Stacks node commit: \`${NODE_COMMIT:-UNRECORDED}\`"
            echo "- PoX-5 contract commit: \`${CONTRACT_COMMIT:-UNRECORDED}\`"
            echo "- Stacks API: \`${STACKS_API_URL:-default}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run E2E tests
        env:
          FIREBLOCKS_API_KEY: ${{ secrets.FIREBLOCKS_API_KEY }}
          FIREBLOCKS_SECRET_KEY: ${{ secrets.FIREBLOCKS_SECRET_KEY }}
          STACKS_NETWORK: TESTNET
          VAULT_A_ID: ${{ secrets.VAULT_A_ID }}
          VAULT_B_ID: ${{ secrets.VAULT_B_ID }}

        run: npm run test:e2e
