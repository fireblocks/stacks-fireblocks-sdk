name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # Type-checks the WHOLE project, including every tracked test suite (the e2e suite
      # is excluded from `npm test`, so this is what keeps it release-blocking that it
      # still compiles — see FBS-32).
      - name: Type-check (incl. all test suites)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test (unit + integration)
        run: npm test
